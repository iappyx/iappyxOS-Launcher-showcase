<!doctype html>
<!--
  Immich plugin — settings page. Launched by Settings → Plugins →
  Configure. Same capability bridges as the runtime, so we can:
    - read/write the API key via iappyx.secureStore.set/get
    - test the connection via iappyx.httpClient.fetch
    - dismiss via iappyx.plugin.close()
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Configure Immich</title>
  <style>
    :root {
      --bg: #0d0d12; --panel: #17171f; --line: #2a2a36;
      --text: #ECECEC; --hint: #8E8E97;
      --accent: #4FC3F7; --error: #FF5252; --ok: #66BB6A;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif; }
    .wrap { padding: 20px; padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--hint); font-size: 13px; margin-bottom: 18px; }
    .field { margin-bottom: 16px; }
    label { display: block; color: var(--hint); font-size: 12px;
      text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
    input[type=text], input[type=password] {
      width: 100%; background: #0a0a10; color: var(--text);
      border: 1px solid var(--line); border-radius: 10px;
      padding: 12px 14px; font: inherit; }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .row { display: flex; gap: 10px; margin-top: 18px; }
    button { flex: 1; background: transparent; color: var(--text);
      border: 1px solid var(--line); border-radius: 10px; padding: 12px;
      font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); color: #001220;
      border-color: var(--accent); font-weight: 600; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { margin-top: 14px; padding: 10px 12px; border-radius: 8px;
      font-size: 13px; display: none; }
    .status.ok { background: rgba(102,187,106,.15); color: var(--ok);
      border: 1px solid rgba(102,187,106,.4); display: block; }
    .status.err { background: rgba(255,82,82,.10); color: var(--error);
      border: 1px solid rgba(255,82,82,.4); display: block; }
    .hint { color: var(--hint); font-size: 12px; line-height: 1.5; margin-top: 6px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Immich</h1>
  <p class="sub">Photos from your self-hosted Immich server. Credentials are stored encrypted; widgets and wallpapers never see them.</p>

  <div class="field">
    <label for="server-url">Server URL</label>
    <input id="server-url" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
           placeholder="https://immich.example.com" />
    <p class="hint">No trailing slash needed.</p>
  </div>

  <div class="field">
    <label for="api-key">API key</label>
    <input id="api-key" type="password" autocomplete="off" autocapitalize="off" autocorrect="off"
           placeholder="paste an API key" />
    <p class="hint">Create one on your Immich instance under Account Settings → API Keys. Encrypted at rest with the device Keystore.</p>
  </div>

  <div class="row">
    <button id="test-btn">Test connection</button>
    <button id="save-btn" class="primary">Save</button>
  </div>

  <div id="status" class="status"></div>
</div>

<script>
(function () {
  'use strict';
  var urlField = document.getElementById('server-url');
  var keyField = document.getElementById('api-key');
  var testBtn  = document.getElementById('test-btn');
  var saveBtn  = document.getElementById('save-btn');
  var status   = document.getElementById('status');

  // Pre-fill with whatever's already stored. iappyx.secureStore.get is
  // synchronous (backed by EncryptedSharedPreferences); no await needed.
  urlField.value = iappyx.secureStore.get('serverUrl') || '';
  keyField.value = iappyx.secureStore.get('apiKey') || '';

  function setStatus(kind, message) {
    status.className = 'status ' + kind;
    status.textContent = message;
  }
  function clearStatus() { status.className = 'status'; status.textContent = ''; }

  function readForm() {
    return {
      serverUrl: urlField.value.trim().replace(/\/+$/, ''),
      apiKey:    keyField.value.trim(),
    };
  }

  testBtn.addEventListener('click', async function () {
    var f = readForm();
    if (!f.serverUrl || !f.apiKey) {
      setStatus('err', 'Fill in both fields first.');
      return;
    }
    testBtn.disabled = true; saveBtn.disabled = true;
    setStatus('ok', 'Pinging server…');
    try {
      // /api/server/ping returns {res:"pong"} on a healthy server.
      // 401 = bad key (but server reachable). Network error = bad URL.
      var r = await iappyx.httpClient.fetch({
        url: f.serverUrl + '/api/server/ping',
        headers: { 'x-api-key': f.apiKey, 'Accept': 'application/json' },
      });
      if (r.status === 200) {
        // Now probe an authenticated endpoint to verify the API key.
        var who = await iappyx.httpClient.fetch({
          url: f.serverUrl + '/api/users/me',
          headers: { 'x-api-key': f.apiKey, 'Accept': 'application/json' },
        });
        if (who.status === 200) {
          var me = {};
          try { me = JSON.parse(who.body) || {}; } catch (_) {}
          setStatus('ok', 'Connected as ' + (me.name || me.email || 'user') + '.');
        } else if (who.status === 401) {
          setStatus('err', 'Server reachable, but the API key was rejected.');
        } else {
          setStatus('err', 'Auth probe failed (' + who.status + ').');
        }
      } else {
        setStatus('err', 'Ping failed (HTTP ' + r.status + ').');
      }
    } catch (e) {
      setStatus('err', 'Network error: ' + (e && e.message || e));
    } finally {
      testBtn.disabled = false; saveBtn.disabled = false;
    }
  });

  saveBtn.addEventListener('click', function () {
    var f = readForm();
    iappyx.secureStore.set('serverUrl', f.serverUrl);
    iappyx.secureStore.set('apiKey',    f.apiKey);
    setStatus('ok', 'Saved.');
    // Brief delay so the user sees the confirmation before dismiss.
    setTimeout(function () { iappyx.plugin.close(); }, 400);
  });

  // Cmd/Ctrl+Enter = save.
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') saveBtn.click();
  });
})();
</script>
</body>
</html>
