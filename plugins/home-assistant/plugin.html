<!doctype html>
<!--
  Home Assistant plugin — runtime. Hidden WebView; never user-visible.

  Surface (all return Promises):
    iappyx.plugin('home-assistant').isConfigured()
    iappyx.plugin('home-assistant').ping()
    iappyx.plugin('home-assistant').state({entityId})
    iappyx.plugin('home-assistant').states({domain, fresh})
    iappyx.plugin('home-assistant').call({domain, service, data, target})
    iappyx.plugin('home-assistant').history({entityId, hours})
    iappyx.plugin('home-assistant').calendars()
    iappyx.plugin('home-assistant').events({entityId, hours})

  Credentials (server URL + long-lived token) live in iappyx.secureStore
  under keys `serverUrl` and `token`. The Configure page (settings.html)
  writes them; runtime re-reads on every call so a credential update
  applies immediately without reloading the plugin WebView.

  Lightweight caching: states({fresh:false}) hits a 30-second
  iappyx.storage cache so widgets that re-render frequently don't
  hammer the server. Pass {fresh:true} for a forced refresh.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Home Assistant plugin</title>
</head>
<body>
<script>
(function () {
  'use strict';

  var STATES_CACHE_KEY = 'cache_states_v1';
  var STATES_CACHE_TTL_MS = 30 * 1000;

  function creds() {
    return {
      serverUrl: (iappyx.secureStore.get('serverUrl') || '').replace(/\/+$/, ''),
      token: iappyx.secureStore.get('token') || '',
    };
  }

  function ok(extra)        { return Object.assign({ ok: true }, extra || {}); }
  function err(message)     { return { ok: false, error: message }; }
  function bearer(tok, extra) {
    var h = { 'Authorization': 'Bearer ' + tok, 'Accept': 'application/json' };
    if (extra) Object.keys(extra).forEach(function (k) { h[k] = extra[k]; });
    return h;
  }

  function authedGet(path, extraHeaders) {
    var c = creds();
    if (!c.serverUrl || !c.token) {
      return Promise.resolve({ status: 0, body: null, raw: '', error: 'not configured' });
    }
    return iappyx.httpClient.fetch({
      url: c.serverUrl + path,
      method: 'GET',
      headers: bearer(c.token, extraHeaders),
    }).then(function (r) {
      var parsed = null;
      try { parsed = r.body ? JSON.parse(r.body) : null; } catch (_) { /* plain text */ }
      return { status: r.status, body: parsed, raw: r.body };
    });
  }

  function authedPost(path, jsonObj) {
    var c = creds();
    if (!c.serverUrl || !c.token) {
      return Promise.resolve({ status: 0, body: null, raw: '', error: 'not configured' });
    }
    return iappyx.httpClient.fetch({
      url: c.serverUrl + path,
      method: 'POST',
      headers: bearer(c.token, { 'Content-Type': 'application/json' }),
      body: JSON.stringify(jsonObj || {}),
    }).then(function (r) {
      var parsed = null;
      try { parsed = r.body ? JSON.parse(r.body) : null; } catch (_) { /* */ }
      return { status: r.status, body: parsed, raw: r.body };
    });
  }

  /** Normalise an HA entity to a tighter shape — drop the verbose
   *  context blocks and last-changed redundancy. Keeps attributes
   *  verbatim though (widgets rely on `friendly_name`, `unit_of_measurement`,
   *  `brightness`, `current_temperature`, `media_title`, etc.). */
  function asEntity(raw) {
    if (!raw) return null;
    return {
      id: raw.entity_id,
      state: raw.state,
      attributes: raw.attributes || {},
      lastChanged: raw.last_changed || null,
      lastUpdated: raw.last_updated || raw.last_changed || null,
    };
  }

  function readCache() {
    try {
      var raw = iappyx.storage.load(STATES_CACHE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.ts || !parsed.entities) return null;
      if (Date.now() - parsed.ts > STATES_CACHE_TTL_MS) return null;
      return parsed.entities;
    } catch (_) { return null; }
  }
  function writeCache(entities) {
    try {
      iappyx.storage.save(STATES_CACHE_KEY, JSON.stringify({ ts: Date.now(), entities: entities }));
    } catch (_) { /* storage full or absent — non-fatal */ }
  }

  iappyx.plugin.export({
    isConfigured: function () {
      var c = creds();
      return ok({ configured: !!(c.serverUrl && c.token) });
    },

    ping: function () {
      return authedGet('/api/config').then(function (r) {
        if (r.error) return err(r.error);
        if (r.status === 401) return err('invalid token');
        if (r.status >= 400) return err('server error ' + r.status);
        var b = r.body || {};
        return ok({
          version: b.version || 'unknown',
          locationName: b.location_name || '',
          timeZone: b.time_zone || '',
          unitSystem: b.unit_system || null,
        });
      });
    },

    state: function (args) {
      var id = args && args.entityId;
      if (!id) return Promise.resolve(err('entityId required'));
      return authedGet('/api/states/' + encodeURIComponent(id)).then(function (r) {
        if (r.error) return err(r.error);
        if (r.status === 401) return err('invalid token');
        if (r.status === 404) return err('unknown entity ' + id);
        if (r.status >= 400) return err('server error ' + r.status);
        return ok({ entity: asEntity(r.body) });
      });
    },

    states: function (args) {
      var domain = (args && args.domain) || '';
      var fresh = !!(args && args.fresh);
      var cached = fresh ? null : readCache();
      var prep = cached
        ? Promise.resolve({ status: 200, body: cached })
        : authedGet('/api/states').then(function (r) {
            if (r.status >= 200 && r.status < 300 && Array.isArray(r.body)) {
              writeCache(r.body);
            }
            return r;
          });
      return prep.then(function (r) {
        if (r.error) return err(r.error);
        if (r.status === 401) return err('invalid token');
        if (r.status >= 400) return err('server error ' + r.status);
        var arr = Array.isArray(r.body) ? r.body : [];
        var entities = arr
          .filter(function (e) {
            if (!domain) return true;
            return e.entity_id && e.entity_id.indexOf(domain + '.') === 0;
          })
          .map(asEntity)
          .filter(Boolean);
        return ok({ entities: entities, cached: !!cached });
      });
    },

    call: function (args) {
      var domain = args && args.domain;
      var service = args && args.service;
      if (!domain || !service) return Promise.resolve(err('domain + service required'));
      var body = {};
      if (args && args.data) {
        Object.keys(args.data).forEach(function (k) { body[k] = args.data[k]; });
      }
      // HA accepts target keys inside the service-call body — entity_id,
      // area_id, device_id are interchangeable with body params for
      // most services. Merge target into the top-level body for
      // simplicity (HA tolerates the redundancy gracefully).
      if (args && args.target) {
        Object.keys(args.target).forEach(function (k) { body[k] = args.target[k]; });
      }
      return authedPost('/api/services/' + encodeURIComponent(domain) +
                        '/' + encodeURIComponent(service), body).then(function (r) {
        if (r.error) return err(r.error);
        if (r.status === 401) return err('invalid token');
        if (r.status >= 400) return err('service call failed ' + r.status + ': ' + (r.raw || ''));
        // HA replies with an array of entity states it touched. Pass through.
        return ok({ status: r.status, touched: Array.isArray(r.body) ? r.body.map(asEntity) : [] });
      });
    },

    history: function (args) {
      var id = args && args.entityId;
      if (!id) return Promise.resolve(err('entityId required'));
      var hours = Math.max(0.083, Math.min(24 * 7, (args && args.hours) || 1)); // 5 min … 7 d
      var fromMs = Date.now() - hours * 3600 * 1000;
      var fromIso = new Date(fromMs).toISOString();
      var path = '/api/history/period/' + encodeURIComponent(fromIso) +
                 '?filter_entity_id=' + encodeURIComponent(id);
      return authedGet(path).then(function (r) {
        if (r.error) return err(r.error);
        if (r.status === 401) return err('invalid token');
        if (r.status >= 400) return err('server error ' + r.status);
        // /history/period returns [[entityHistory]] — outer array per
        // requested entity, inner array per state change. We only ever
        // ask for one entity, so flatten the outer dimension.
        var series = Array.isArray(r.body) && Array.isArray(r.body[0]) ? r.body[0] : [];
        var points = series.map(function (s) {
          return {
            state: s.state,
            timestamp: s.last_changed || s.last_updated,
            attributes: s.attributes || {},
          };
        });
        return ok({ points: points });
      });
    },

    calendars: function () {
      return authedGet('/api/calendars').then(function (r) {
        if (r.error) return err(r.error);
        if (r.status === 401) return err('invalid token');
        if (r.status >= 400) return err('server error ' + r.status);
        var arr = Array.isArray(r.body) ? r.body : [];
        return ok({
          calendars: arr.map(function (c) {
            return { entityId: c.entity_id, name: c.name || c.entity_id };
          }),
        });
      });
    },

    events: function (args) {
      var id = args && args.entityId;
      if (!id) return Promise.resolve(err('entityId required'));
      var hours = Math.max(1, Math.min(24 * 30, (args && args.hours) || 24));
      var nowIso = new Date().toISOString();
      var endIso = new Date(Date.now() + hours * 3600 * 1000).toISOString();
      var path = '/api/calendars/' + encodeURIComponent(id) +
                 '?start=' + encodeURIComponent(nowIso) +
                 '&end=' + encodeURIComponent(endIso);
      return authedGet(path).then(function (r) {
        if (r.error) return err(r.error);
        if (r.status === 401) return err('invalid token');
        if (r.status >= 400) return err('server error ' + r.status);
        var arr = Array.isArray(r.body) ? r.body : [];
        return ok({
          events: arr.map(function (e) {
            return {
              summary: e.summary || '',
              start: (e.start && (e.start.dateTime || e.start.date)) || null,
              end: (e.end && (e.end.dateTime || e.end.date)) || null,
              location: e.location || '',
              description: e.description || '',
            };
          }),
        });
      });
    },

    /** Universal-search source. Filters cached entity list by friendly
     *  name; returns inline interactive HTML per hit (toggles for
     *  lights/switches, up/down for climate, transport for media). Uses
     *  the 30-second states cache so type-ahead doesn't hammer HA;
     *  passes `fresh:false` (the default).
     *
     *  Domains surfaced (in this priority): light, switch, climate,
     *  media_player, scene, script. Other domains (sensor, binary_sensor)
     *  show as read-only chips if their friendly name matches — useful
     *  for "temperature outside" type queries. */
    universalSearch: function (args) {
      var q = String((args && args.query) || '').trim().toLowerCase();
      if (!q) return ok({ results: [] });
      return authedGet('/api/states').then(function (r) {
        if (r.error) return err(r.error);
        if (r.status >= 400) return err('HA HTTP ' + r.status);
        var entities = Array.isArray(r.body) ? r.body : [];
        // Per-domain rank bonus added to the fuzzy match score. The
        // match score still dominates (~50-1000+) — this bonus breaks
        // ties so within an equally-good fuzzy match, premium controls
        // (scenes, lights, switches, climate, media) outrank read-only
        // sensors. See the table in the plugin README / aiPrompt for
        // the reasoning behind these numbers.
        var DOMAIN_RANK = {
          // Tier 1 — premium daily-use controls. Lights at the top:
          // they're the most-frequent action, full stop. Scenes are
          // still high-value (one tap = whole-room state) but slot
          // just below lights.
          light: 140, switch: 125, scene: 120, climate: 110, media_player: 105,
          // Tier 2 — actionable but less common
          script: 80, fan: 75, input_boolean: 75, input_button: 70,
          vacuum: 65, cover: 60, automation: 55,
          // Tier 3 — read-only chips
          sensor: 25, binary_sensor: 20, input_number: 15, input_select: 15,
        };
        // Set of allowed domains (anything not in DOMAIN_RANK is dropped).
        var ALLOWED = DOMAIN_RANK;
        // Score every candidate entity; keep top 10 by score so a
        // strong substring match wins over a weak subsequence one,
        // and within equally-good matches the premium domains rank up.
        //
        // Light/switch/cover/media_player groups carry an `entity_id`
        // ATTRIBUTE listing their child entities. We rank groups above
        // children AND dedupe: if both a group and its members match
        // the query, only the group is shown — the children are noise.
        //
        // BUT: scenes, automations, and legacy `group.*` entities ALSO
        // use `entity_id` arrays — semantically "entities this thing
        // affects," NOT children. Treating them as groups makes scenes
        // eat their member lights from search results. So we restrict
        // group-detection to the four domains where parent/child means
        // what we want.
        var GROUP_DOMAINS = { light:1, switch:1, cover:1, media_player:1 };
        var childToGroup = {};
        for (var i0 = 0; i0 < entities.length; i0++) {
          var ge = entities[i0];
          if (!ge.attributes || !Array.isArray(ge.attributes.entity_id)) continue;
          var gid = ge.entity_id || '';
          var gdot = gid.indexOf('.');
          if (gdot < 0) continue;
          if (!GROUP_DOMAINS[gid.substring(0, gdot)]) continue;
          for (var k = 0; k < ge.attributes.entity_id.length; k++) {
            var child = String(ge.attributes.entity_id[k]);
            childToGroup[child] = gid;
          }
        }
        var scored = [];
        for (var i = 0; i < entities.length; i++) {
          var e = entities[i];
          var id = e.entity_id || '';
          var dot = id.indexOf('.');
          if (dot < 0) continue;
          var domain = id.substring(0, dot);
          if (!Object.prototype.hasOwnProperty.call(ALLOWED, domain)) continue;
          var name = ((e.attributes && e.attributes.friendly_name) ||
                      id.substring(dot+1)).toString();
          // Score against multiple haystacks. Best fuzzy score wins.
          var areaId = String((e.attributes && e.attributes.area_id) || '');
          var matchScore = Math.max(
            fuzzyScore(q, name),
            fuzzyScore(q, id),
            fuzzyScore(q, areaId),
          );
          if (matchScore <= 0) continue;
          // Group bonus: only true for entities in GROUP_DOMAINS
          // (light/switch/cover/media_player) that carry an
          // `entity_id` array. Tiny bonus (15) — enough to float above
          // siblings with identical match scores but small enough that
          // a perfect-prefix child still beats a weak-match parent.
          var isGroup = !!GROUP_DOMAINS[domain] &&
                        !!(e.attributes && Array.isArray(e.attributes.entity_id));
          // Final score = match quality (dominant) + domain bonus +
          // group bonus.
          var score = matchScore + (DOMAIN_RANK[domain] || 0) + (isGroup ? 15 : 0);
          scored.push({
            score: score,
            entityId: id,
            isGroup: isGroup,
            render: renderEntityHit(domain, id, name, e),
          });
        }
        scored.sort(function (a, b) { return b.score - a.score; });
        // Dedupe pass: walk best-score-first, skip any entity whose
        // parent group is already in the output. Stop at 10 visible.
        var visible = [];
        var addedGroups = {};
        for (var s = 0; s < scored.length; s++) {
          var item = scored[s];
          var parent = childToGroup[item.entityId];
          if (parent && addedGroups[parent]) continue;  // its group is already in
          visible.push(item);
          if (item.isGroup) addedGroups[item.entityId] = true;
          if (visible.length >= 10) break;
        }
        scored = visible;
        var out = [];
        for (var j = 0; j < scored.length && out.length < 10; j++) {
          if (scored[j].render) out.push(scored[j].render);
        }
        return ok({ results: out });
      });
    },
  });

  // ── Fuzzy match — three tiers ────────────────────────────────
  // 1. exact prefix → 1000+ (sorts to top)
  // 2. any substring → 800 - position (earlier = higher)
  // 3. subsequence (q chars appear in order in target) → up to 200
  // Returns 0 for no match. Used by search() to rank candidates
  // across friendly_name + entity_id + area_id.
  function fuzzyScore(query, target) {
    if (!query || !target) return 0;
    var q = String(query).toLowerCase();
    var t = String(target).toLowerCase();
    if (t.indexOf(q) === 0) return 1000 + q.length;
    var idx = t.indexOf(q);
    if (idx >= 0) return 800 - Math.min(idx, 700);
    // Subsequence: every query char appears in target in order.
    var qi = 0;
    for (var ti = 0; ti < t.length && qi < q.length; ti++) {
      if (q.charAt(qi) === t.charAt(ti)) qi++;
    }
    if (qi === q.length) return Math.max(50, 200 - (t.length - q.length));
    return 0;
  }

  // ── Search-result renderers ──────────────────────────────────

  function renderEntityHit(domain, id, name, e) {
    var state = (e.state || '').toString();
    var attrs = e.attributes || {};
    if (domain === 'light' || domain === 'switch') {
      var on = (state === 'on');
      var bri = attrs.brightness != null ? attrs.brightness : 255;
      return {
        id: 'ha:' + id,
        title: name,
        subtitle: (domain === 'light' ? 'Light' : 'Switch') + ' · ' + state
          + (domain === 'light' && on ? ' · ' + Math.round(bri/255*100) + '%' : ''),
        icon: null,
        height: domain === 'light' ? 70 : 56,
        html: lightSwitchHtml(domain, id, on, bri),
      };
    }
    if (domain === 'scene' || domain === 'script') {
      return {
        id: 'ha:' + id,
        title: name,
        subtitle: (domain === 'scene' ? 'Scene' : 'Script') + ' · tap to run',
        icon: null,
        height: 56,
        html: triggerHtml(domain, id),
      };
    }
    if (domain === 'media_player') {
      var playing = (state === 'playing');
      var track = (attrs.media_title || attrs.media_artist || '').toString();
      return {
        id: 'ha:' + id,
        title: name,
        subtitle: 'Media · ' + state + (track ? ' · ' + track : ''),
        icon: null,
        height: 56,
        html: mediaHtml(id, playing),
      };
    }
    if (domain === 'climate') {
      var current = attrs.current_temperature != null ? attrs.current_temperature : '?';
      var target  = attrs.temperature != null ? attrs.temperature : (current || 20);
      return {
        id: 'ha:' + id,
        title: name,
        subtitle: 'Climate · current ' + current + '°',
        icon: null,
        height: 70,
        html: climateHtml(id, target),
      };
    }
    // Read-only — friendly chip with current state + unit.
    var unit = attrs.unit_of_measurement || '';
    return {
      id: 'ha:' + id,
      title: name,
      subtitle: state + (unit ? ' ' + unit : '') + ' · read-only',
      icon: null,
      height: 44,
      html: '<div style="opacity:.85;font-size:14px;line-height:44px;">'
        + escapeHtml(state) + (unit ? ' <span style="opacity:.7;font-size:11px">' + escapeHtml(unit) + '</span>' : '')
        + '</div>',
    };
  }

  function lightSwitchHtml(domain, id, on, bri) {
    var hasBri = (domain === 'light');
    var idJson = JSON.stringify(id);
    return ''
      + '<div style="display:flex;align-items:center;gap:10px;height:100%;">'
      + '<button id="t" style="border:1px solid #555;background:'
      + (on?'#fff':'#222') + ';color:' + (on?'#000':'#fff')
      + ';border-radius:14px;padding:8px 14px;min-width:62px;">'
      + (on?'ON':'OFF') + '</button>'
      + (hasBri
          ? '<input id="b" type="range" min="1" max="255" value="' + bri + '" style="flex:1;accent-color:#fff;">'
          : '<div style="flex:1"></div>')
      + '</div>'
      + '<script>(function(){'
      + 'var t=document.getElementById("t"),b=document.getElementById("b");'
      + 'var on=' + (on?'true':'false') + ';'
      + 't.addEventListener("click",function(){on=!on;'
      + '  t.textContent=on?"ON":"OFF";'
      + '  t.style.background=on?"#fff":"#222";t.style.color=on?"#000":"#fff";'
      + '  iappyx.plugin("home-assistant").call({domain:"' + domain + '",'
      +     'service:on?"turn_on":"turn_off",target:{entity_id:' + idJson + '}'
      +     (hasBri ? ',data:{brightness:parseInt(b.value,10)}' : '')
      + '  });'
      + '});'
      + (hasBri
          ? 'var bt=null;b.addEventListener("input",function(){'
          + '  clearTimeout(bt);'
          + '  bt=setTimeout(function(){'
          + '    iappyx.plugin("home-assistant").call({domain:"light",service:"turn_on",'
          + '      target:{entity_id:' + idJson + '},data:{brightness:parseInt(b.value,10)}});'
          + '  },120);'
          + '});'
          : '')
      + '})();<\/script>';
  }

  function triggerHtml(domain, id) {
    var idJson = JSON.stringify(id);
    var service = (domain === 'scene') ? 'turn_on' : 'turn_on';
    return ''
      + '<button id="t" style="border:1px solid #555;background:#fff;color:#000;'
      + 'border-radius:14px;padding:10px 18px;font-weight:600;">Run</button>'
      + '<script>(function(){document.getElementById("t").addEventListener("click",function(){'
      + 'iappyx.plugin("home-assistant").call({domain:"' + domain + '",'
      + 'service:"' + service + '",target:{entity_id:' + idJson + '}});'
      + '});})();<\/script>';
  }

  function mediaHtml(id, playing) {
    var idJson = JSON.stringify(id);
    return ''
      + '<div style="display:flex;align-items:center;gap:6px;height:100%;">'
      + '<button id="p" style="border:1px solid #555;background:'
      +   (playing?'#fff':'#222') + ';color:' + (playing?'#000':'#fff')
      + ';border-radius:14px;padding:8px 14px;">' + (playing?'⏸':'▶') + '</button>'
      + '<button id="n" style="border:1px solid #555;background:#222;color:#fff;'
      + 'border-radius:14px;padding:8px 14px;">⏭</button>'
      + '</div>'
      + '<script>(function(){'
      + 'var pl=' + (playing?'true':'false') + ';'
      + 'document.getElementById("p").addEventListener("click",function(){'
      + '  iappyx.plugin("home-assistant").call({domain:"media_player",'
      + '    service:pl?"media_pause":"media_play",target:{entity_id:' + idJson + '}});'
      + '});'
      + 'document.getElementById("n").addEventListener("click",function(){'
      + '  iappyx.plugin("home-assistant").call({domain:"media_player",'
      + '    service:"media_next_track",target:{entity_id:' + idJson + '}});'
      + '});'
      + '})();<\/script>';
  }

  function climateHtml(id, target) {
    var idJson = JSON.stringify(id);
    return ''
      + '<div style="display:flex;align-items:center;gap:8px;height:100%;">'
      + '<button id="m" style="border:1px solid #555;background:#222;color:#fff;'
      +   'border-radius:14px;padding:8px 12px;min-width:36px;">−</button>'
      + '<div id="t" style="min-width:46px;text-align:center;font-size:18px;font-weight:600;">'
      +   target + '°</div>'
      + '<button id="p" style="border:1px solid #555;background:#222;color:#fff;'
      +   'border-radius:14px;padding:8px 12px;min-width:36px;">+</button>'
      + '</div>'
      + '<script>(function(){'
      + 'var v=' + target + ',t=document.getElementById("t");'
      + 'function setIt(){t.textContent=v+"°";'
      + '  iappyx.plugin("home-assistant").call({domain:"climate",'
      + '    service:"set_temperature",target:{entity_id:' + idJson + '},data:{temperature:v}});'
      + '}'
      + 'document.getElementById("m").addEventListener("click",function(){v=Math.max(5,v-1);setIt();});'
      + 'document.getElementById("p").addEventListener("click",function(){v=Math.min(35,v+1);setIt();});'
      + '})();<\/script>';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g,function(c){
