<!doctype html>
<!--
  GitHub plugin — runtime.

  Auth: simple Personal Access Token (classic or fine-grained). Pasted
  into settings.html, stored in secureStore. No OAuth dance — PATs are
  much friendlier than OAuth for a single-user plugin, and GitHub's
  fine-grained PATs let the user scope down to specific repos.

  Surface — see manifest.aiPrompt for the full list.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>GitHub plugin</title>
</head>
<body>
<script>
(function () {
  'use strict';

  var API_BASE = 'https://api.github.com';

  function ok(extra)    { return Object.assign({ ok: true }, extra || {}); }
  function err(message) { return { ok: false, error: message }; }

  function token() { return iappyx.secureStore.get('token') || ''; }
  function userLogin() { return iappyx.secureStore.get('login') || ''; }

  function authedGet(path) {
    var t = token();
    if (!t) return Promise.resolve({ status: 0, body: null, error: 'not configured' });
    return iappyx.httpClient.fetch({
      url: API_BASE + path,
      method: 'GET',
      headers: {
        'Authorization': 'Bearer ' + t,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
      },
    }).then(function (r) {
      var parsed = null;
      try { parsed = r.body ? JSON.parse(r.body) : null; } catch (_) {}
      return { status: r.status, body: parsed, raw: r.body };
    });
  }

  function statusErr(status) {
    if (status === 401) return 'token invalid or revoked';
    if (status === 403) return 'rate limited or scope missing';
    if (status === 404) return 'not found (private repo without scope?)';
    return 'server error ' + status;
  }

  // ── shape adapters ───────────────────────────────────────────
  function asRepoSummary(raw) {
    if (!raw) return null;
    return {
      owner: raw.owner && raw.owner.login || '',
      name: raw.name || '',
      fullName: raw.full_name || '',
      description: raw.description || '',
      language: raw.language || '',
      stars: raw.stargazers_count || 0,
      forks: raw.forks_count || 0,
      openIssues: raw.open_issues_count || 0,
      updatedAt: raw.updated_at || null,
      pushedAt: raw.pushed_at || null,
      htmlUrl: raw.html_url || null,
      isArchived: !!raw.archived,
      isFork: !!raw.fork,
      isPrivate: !!raw.private,
      defaultBranch: raw.default_branch || 'main',
    };
  }

  function asPullRequest(raw) {
    if (!raw) return null;
    var repo = '';
    var fromSearch = false;
    if (raw.repository_url) {
      // search API gives repository_url like https://api.github.com/repos/owner/name
      var parts = raw.repository_url.split('/');
      repo = parts.slice(-2).join('/');
      fromSearch = true;  // search payload lacks PR-specific fields
    } else if (raw.base && raw.base.repo) {
      repo = raw.base.repo.full_name;
    }
    // mergeable / mergeable_state ONLY exist on the dedicated PR API
    // (/repos/:owner/:repo/pulls/:n). The search-issues endpoint
    // returns the issue shape — both fields are undefined and the
    // naive `!== 'dirty' && !== false` check evaluates true for
    // every result. Surface `null` from search results so the widget
    // can render "merge state unknown" instead of falsely "ready".
    var mergeable = fromSearch
      ? null
      : (raw.mergeable_state !== 'dirty' && raw.mergeable !== false);
    return {
      repo: repo,
      number: raw.number,
      title: raw.title || '',
      author: raw.user && raw.user.login || '',
      draft: !!raw.draft,
      mergeable: mergeable,
      state: raw.state || 'open',
      createdAt: raw.created_at || null,
      updatedAt: raw.updated_at || null,
      closedAt: raw.closed_at || null,
      mergedAt: raw.merged_at || null,
      htmlUrl: raw.html_url || null,
      additions: raw.additions || 0,
      deletions: raw.deletions || 0,
      commits: raw.commits || 0,
      reviewers: (raw.requested_reviewers || []).map(function (u) { return u.login; }),
      labels: (raw.labels || []).map(function (l) { return { name: l.name, color: l.color }; }),
      body: raw.body || '',
    };
  }

  function asIssue(raw) {
    if (!raw) return null;
    var repo = '';
    if (raw.repository_url) {
      var parts = raw.repository_url.split('/');
      repo = parts.slice(-2).join('/');
    }
    return {
      repo: repo,
      number: raw.number,
      title: raw.title || '',
      author: raw.user && raw.user.login || '',
      state: raw.state || 'open',
      labels: (raw.labels || []).map(function (l) { return { name: l.name, color: l.color }; }),
      assignees: (raw.assignees || []).map(function (u) { return u.login; }),
      createdAt: raw.created_at || null,
      updatedAt: raw.updated_at || null,
      htmlUrl: raw.html_url || null,
      comments: raw.comments || 0,
      isPullRequest: !!raw.pull_request,
    };
  }

  function asNotification(raw) {
    if (!raw) return null;
    var subject = raw.subject || {};
    return {
      id: raw.id,
      repo: raw.repository && raw.repository.full_name || '',
      type: subject.type || 'Notification',
      title: subject.title || '',
      reason: raw.reason || '',
      updatedAt: raw.updated_at || null,
      lastReadAt: raw.last_read_at || null,
      url: subject.url || null,
      unread: !!raw.unread,
    };
  }

  function asEvent(raw) {
    if (!raw) return null;
    var summary = '';
    var p = raw.payload || {};
    switch (raw.type) {
      case 'PushEvent':
        summary = (p.size || 0) + ' commit(s) to ' + (p.ref || '').replace('refs/heads/', '');
        break;
      case 'PullRequestEvent':
        summary = (p.action || 'updated') + ' PR #' + (p.pull_request && p.pull_request.number);
        break;
      case 'IssuesEvent':
        summary = (p.action || 'updated') + ' issue #' + (p.issue && p.issue.number);
        break;
      case 'ReleaseEvent':
        summary = 'released ' + (p.release && (p.release.tag_name || p.release.name));
        break;
      case 'WatchEvent': summary = 'starred'; break;
      case 'ForkEvent':  summary = 'forked'; break;
      case 'CreateEvent': summary = 'created ' + (p.ref_type || '') + ' ' + (p.ref || ''); break;
      default: summary = (p.action || '') || '';
    }
    return {
      type: raw.type || '',
      repo: raw.repo && raw.repo.name || '',
      actor: raw.actor && raw.actor.login || '',
      createdAt: raw.created_at || null,
      public: !!raw.public,
      payloadSummary: summary.trim(),
    };
  }

  // ── exposed methods ──────────────────────────────────────────
  iappyx.plugin.export({

    isConfigured: function () {
      return ok({ configured: !!token() });
    },

    profile: function () {
      return authedGet('/user').then(function (r) {
        if (r.error) return err(r.error);
        if (r.status >= 400) return err(statusErr(r.status));
        var b = r.body || {};
        // Cache login for use in search-API "@me" filters that don't
        // resolve server-side.
        if (b.login) iappyx.secureStore.set('login', b.login);
        return ok({
          login: b.login || '',
          name: b.name || '',
          email: b.email || '',
          avatarUrl: b.avatar_url || '',
          publicRepos: b.public_repos || 0,
          publicGists: b.public_gists || 0,
          followers: b.followers || 0,
          following: b.following || 0,
          htmlUrl: b.html_url || '',
          createdAt: b.created_at || null,
          twoFactorEnabled: b.two_factor_authentication,
        });
      });
    },

    notifications: function (args) {
      var all = !!(args && args.all);
      var participating = !!(args && args.participating);
      var top = Math.max(1, Math.min(50, (args && args.top) || 25));
      var qs = '?per_page=' + top
        + '&all=' + all
        + '&participating=' + participating;
      return authedGet('/notifications' + qs).then(function (r) {
        if (r.error) return err(r.error);
        if (r.status >= 400) return err(statusErr(r.status));
        var items = (r.body || []).map(asNotification).filter(Boolean);
        return ok({ items: items });
      });
    },

    pullRequestsToReview: function (args) {
      var top = Math.max(1, Math.min(50, (args && args.top) || 25));
      // Search API: PRs requesting our review, sorted by updated.
      var q = 'is:pr is:open review-requested:@me';
      return authedGet('/search/issues?q=' + encodeURIComponent(q)
        + '&sort=updated&order=desc&per_page=' + top).then(function (r) {
        if (r.error) return err(r.error);
        if (r.status >= 400) return err(statusErr(r.status));
        var items = ((r.body && r.body.items) || []).map(asPullRequest).filter(Boolean);
        return ok({ items: items, totalCount: (r.body && r.body.total_count) || items.length });
      });
    },

    pullRequestsCreated: function (args) {
      var state = (args && args.state) || 'open';
      var top = Math.max(1, Math.min(50, (args && args.top) || 25));
      var q = 'is:pr author:@me state:' + state;
      return authedGet('/search/issues?q=' + encodeURIComponent(q)
        + '&sort=updated&order=desc&per_page=' + top).then(function (r) {
        if (r.error) return err(r.error);
        if (r.status >= 400) return err(statusErr(r.status));
        var items = ((r.body && r.body.items) || []).map(asPullRequest).filter(Boolean);
        return ok({ items: items, totalCount: (r.body && r.body.total_count) || items.length });
      });
    },

    issuesAssigned: function (args) {
      var state = (args && args.state) || 'open';
      var top = Math.max(1, Math.min(50, (args && args.top) || 25));
      // /issues — Issues assigned to the authenticated user across all
      // accessible repos. state can be open, closed, all.
      var qs = '?state=' + encodeURIComponent(state)
        + '&filter=assigned'
        + '&per_page=' + top
        + '&sort=updated&direction=desc';
      return authedGet('/issues' + qs).then(function (r) {
        if (r.error) return err(r.error);
        if (r.status >= 400) return err(statusErr(r.status));
        var items = (r.body || []).map(asIssue).filter(function (i) {
          return i && !i.isPullRequest;  // /issues includes PRs by default
        });
        return ok({ items: items });
      });
    },

    starredRepos: function (args) {
      var top = Math.max(1, Math.min(100, (args && args.top) || 25));
      return authedGet('/user/starred?per_page=' + top + '&sort=created')
        .then(function (r) {
          if (r.error) return err(r.error);
          if (r.status >= 400) return err(statusErr(r.status));
          var items = (r.body || []).map(asRepoSummary).filter(Boolean);
          return ok({ items: items });
        });
    },

    recentEvents: function (args) {
      var top = Math.max(1, Math.min(100, (args && args.top) || 25));
      var login = userLogin();
      if (!login) {
        // Resolve once via /user and cache.
        return authedGet('/user').then(function (rr) {
          var u = rr.body && rr.body.login;
          if (!u) return err('couldn\'t resolve login');
          iappyx.secureStore.set('login', u);
          return authedGet('/users/' + encodeURIComponent(u) + '/events?per_page=' + top)
            .then(handleEvents);
        });
      }
      return authedGet('/users/' + encodeURIComponent(login) + '/events?per_page=' + top)
        .then(handleEvents);

      function handleEvents(r) {
        if (r.error) return err(r.error);
        if (r.status >= 400) return err(statusErr(r.status));
        var items = (r.body || []).map(asEvent).filter(Boolean);
        return ok({ items: items });
      }
    },

    repoInfo: function (args) {
      var owner = args && args.owner;
      var repo  = args && args.repo;
      if (!owner || !repo) return Promise.resolve(err('owner and repo required'));
      var path = '/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo);
      return Promise.all([
        authedGet(path),
        authedGet(path + '/releases/latest'),
      ]).then(function (rs) {
        var rr = rs[0], lr = rs[1];
        if (rr.error) return err(rr.error);
        if (rr.status >= 400) return err(statusErr(rr.status));
        var summary = asRepoSummary(rr.body);
        var latest = (lr.status === 200 && lr.body) ? {
          tagName: lr.body.tag_name,
          name: lr.body.name,
          publishedAt: lr.body.published_at,
          htmlUrl: lr.body.html_url,
          body: lr.body.body || '',
        } : null;
        return ok({ repo: summary, latestRelease: latest });
      });
    },

    repoTraffic: function (args) {
      var owner = args && args.owner;
      var repo  = args && args.repo;
      if (!owner || !repo) return Promise.resolve(err('owner and repo required'));
      var path = '/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo);
      return Promise.all([
        authedGet(path + '/traffic/views'),
        authedGet(path + '/traffic/clones'),
      ]).then(function (rs) {
        // Traffic endpoints require push permission. Surface a clean
        // {ok:false} so widgets can render "permission required".
        if (rs[0].status === 403 || rs[1].status === 403) {
          return err('repo traffic requires push permission');
        }
        if (rs[0].error || rs[1].error) {
          return err(rs[0].error || rs[1].error);
        }
        return ok({
          views: rs[0].body || { count: 0, uniques: 0, days: [] },
          clones: rs[1].body || { count: 0, uniques: 0, days: [] },
        });
      });
    },

    // ── Search-result action methods ─────────────────────────
    // Called from the inline HTML rendered by universalSearch — see
    // renderPrHit / renderIssueHit / renderNotifHit above.

    approvePr: function (args) {
      var owner = args && args.owner, repo = args && args.repo, num = args && args.num;
      if (!owner || !repo || !num) return Promise.resolve(err('owner+repo+num required'));
      var t = token();
      if (!t) return Promise.resolve(err('not configured'));
      return iappyx.httpClient.fetch({
        url: API_BASE + '/repos/' + encodeURIComponent(owner) + '/'
             + encodeURIComponent(repo) + '/pulls/' + num + '/reviews',
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + t,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ event: 'APPROVE' }),
      }).then(function (r) {
        if (r.status >= 400) return err(statusErr(r.status));
        return ok({});
      });
    },

    closeIssue: function (args) {
      var owner = args && args.owner, repo = args && args.repo, num = args && args.num;
      if (!owner || !repo || !num) return Promise.resolve(err('owner+repo+num required'));
      var t = token();
      if (!t) return Promise.resolve(err('not configured'));
      return iappyx.httpClient.fetch({
        url: API_BASE + '/repos/' + encodeURIComponent(owner) + '/'
             + encodeURIComponent(repo) + '/issues/' + num,
        method: 'PATCH',
        headers: {
          'Authorization': 'Bearer ' + t,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ state: 'closed' }),
      }).then(function (r) {
        if (r.status >= 400) return err(statusErr(r.status));
        return ok({});
      });
    },

    markNotificationRead: function (args) {
      var id = args && args.threadId;
      if (!id) return Promise.resolve(err('threadId required'));
      var t = token();
      if (!t) return Promise.resolve(err('not configured'));
      return iappyx.httpClient.fetch({
        url: API_BASE + '/notifications/threads/' + encodeURIComponent(id),
        method: 'PATCH',
        headers: {
          'Authorization': 'Bearer ' + t,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
        },
      }).then(function (r) {
        // 205 = success per GitHub docs; treat 2xx as ok.
        if (r.status >= 400) return err(statusErr(r.status));
        return ok({});
      });
    },

    search: function (args) {
      // Dispatch: universal launcher search (`{query}`) vs GitHub REST
      // API search (`{type, q, top}`). The universal path returns the
      // launcher-search result shape (with inline interactive HTML);
      // the API path preserves the original behaviour for widgets that
      // were already calling iappyx.plugin('github').search({type,q}).
      if (args && typeof args.query === 'string') return universalSearch(args.query);
      var type = (args && args.type) || 'repositories';
      var q = args && args.q;
      var top = Math.max(1, Math.min(50, (args && args.top) || 25));
      if (!q) return Promise.resolve(err('q required'));
      var allowed = { repositories: 1, issues: 1, commits: 1, code: 1, users: 1 };
      if (!allowed[type]) return Promise.resolve(err('unknown search type'));
      var headers = { 'Accept': 'application/vnd.github+json' };
      // /search/commits needs the cloak preview header.
      if (type === 'commits') headers['Accept'] = 'application/vnd.github.cloak-preview+json';
      var t = token();
      if (!t) return Promise.resolve(err('not configured'));
      return iappyx.httpClient.fetch({
        url: API_BASE + '/search/' + type + '?q=' + encodeURIComponent(q) + '&per_page=' + top,
        method: 'GET',
        headers: Object.assign({
          'Authorization': 'Bearer ' + t,
          'X-GitHub-Api-Version': '2022-11-28',
        }, headers),
      }).then(function (r) {
        var parsed = null;
        try { parsed = r.body ? JSON.parse(r.body) : null; } catch (_) {}
        if (r.status >= 400) return err(statusErr(r.status));
        var items = (parsed && parsed.items) || [];
        var normalized;
        if (type === 'repositories') normalized = items.map(asRepoSummary);
        else if (type === 'issues') normalized = items.map(function (i) {
          return i.pull_request ? asPullRequest(i) : asIssue(i);
        });
        else normalized = items;  // commits, code, users — return raw
        return ok({
          type: type,
          items: normalized.filter(Boolean),
          totalCount: (parsed && parsed.total_count) || 0,
        });
      });
    },
  });

  // ── Universal launcher-search adapter ──────────────────────
  // Three parallel fetches: PRs awaiting our review, assigned issues
  // (open), recent unread notifications. Filter each list by query
  // contains (case-insensitive) on the title. Cap 5 per source.
  // Total wall-clock is bounded by the slowest of the three, but the
  // launcher's aggregator has a 500ms budget per plugin — well over
  // GitHub's typical response time.
  function universalSearch(rawQuery) {
    var q = String(rawQuery || '').trim().toLowerCase();
    if (!q) return Promise.resolve(ok({ results: [] }));
    var t = token();
    if (!t) return Promise.resolve(ok({ results: [] }));

    function fetchSearch(qStr) {
      return iappyx.httpClient.fetch({
        url: API_BASE + '/search/issues?q=' + encodeURIComponent(qStr)
             + '&sort=updated&order=desc&per_page=10',
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + t,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
        },
      }).then(function (r) {
        if (r.status >= 400) return [];
        try { return (JSON.parse(r.body || '{}').items) || []; }
        catch (_) { return []; }
      }).catch(function () { return []; });
    }
    function fetchNotifs() {
      return iappyx.httpClient.fetch({
        url: API_BASE + '/notifications?per_page=15',
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + t,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
        },
      }).then(function (r) {
        if (r.status >= 400) return [];
        try { return JSON.parse(r.body || '[]') || []; }
        catch (_) { return []; }
      }).catch(function () { return []; });
    }

    return Promise.all([
      fetchSearch('is:pr is:open review-requested:@me'),
      fetchSearch('is:issue is:open assignee:@me'),
      fetchNotifs(),
    ]).then(function (rs) {
      var prs    = rs[0].map(function (i) { return i.pull_request ? asPullRequest(i) : asIssue(i); });
      var issues = rs[1].map(asIssue);
      var notifs = rs[2].map(asNotification).filter(Boolean);
      var out = [];
      // Filter + render PRs first (highest urgency in dev workflow).
      prs.filter(function (p) { return p && titleMatches(p.title, q); })
         .slice(0, 5).forEach(function (p) { out.push(renderPrHit(p)); });
      issues.filter(function (i) { return i && titleMatches(i.title, q); })
         .slice(0, 5).forEach(function (i) { out.push(renderIssueHit(i)); });
      // Notifications LAST — they're less actionable than the PR/issue
      // rows above, but useful for "where did that ping come from".
      notifs.filter(function (n) { return n && titleMatches(n.subject || n.title || '', q); })
         .slice(0, 5).forEach(function (n) { out.push(renderNotifHit(n)); });
      return ok({ results: out });
    });
  }

  function titleMatches(title, q) {
    return String(title || '').toLowerCase().indexOf(q) >= 0;
  }

  // ── Search-result renderers ────────────────────────────────
  // Inline HTML loaded into a tiny launcher-search WebView. Calls back
  // via iappyx.plugin('github').* (proxied through the launcher's
  // plugin bridge) to do the actual GitHub API work.

  function renderPrHit(p) {
    var owner = (p.repo && p.repo.owner) || p.repository_url
      ? extractOwner(p.repository_url || (p.repo && p.repo.fullName) || '')
      : '';
    var repo  = (p.repo && p.repo.name) || extractRepo(p.repository_url || '') || '';
    var num   = p.number || 0;
    var idJson    = JSON.stringify({ owner: owner, repo: repo, num: num });
    return {
      id: 'gh:pr:' + owner + '/' + repo + '#' + num,
      title: '#' + num + ' · ' + (p.title || '').slice(0, 80),
      subtitle: owner + '/' + repo + ' · PR by ' + (p.user && p.user.login || '?'),
      icon: null,
      height: 60,
      html: ''
        + '<div style="display:flex;align-items:center;gap:8px;height:100%;">'
        + '  <span id="s" style="background:#222;border:1px solid #555;'
        +     'border-radius:14px;padding:6px 12px;font-size:12px;flex:1;'
        +     'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Review pending</span>'
        + '  <button id="a" style="border:1px solid #66BB6A;background:#1a3a1a;color:#66BB6A;'
        +     'border-radius:14px;padding:8px 14px;font-weight:600;">Approve</button>'
        + '</div>'
        + '<script>(function(){'
        + '  var p=' + idJson + ',a=document.getElementById("a"),s=document.getElementById("s");'
        + '  a.addEventListener("click",function(){'
        + '    a.disabled=true;a.textContent="…";'
        + '    iappyx.plugin("github").approvePr(p)'
        + '      .then(function(r){'
        + '        s.textContent="Approved ✓";a.style.display="none";'
        + '      })'
        + '      .catch(function(e){'
        + '        a.disabled=false;a.textContent="Approve";s.textContent=(e&&e.message)||"failed";'
        + '      });'
        + '  });'
        + '})();<\/script>',
    };
  }

  function renderIssueHit(i) {
    var owner = extractOwner(i.repository_url || '');
    var repo  = extractRepo(i.repository_url || '');
    var num   = i.number || 0;
    var idJson = JSON.stringify({ owner: owner, repo: repo, num: num });
    return {
      id: 'gh:issue:' + owner + '/' + repo + '#' + num,
      title: '#' + num + ' · ' + (i.title || '').slice(0, 80),
      subtitle: owner + '/' + repo + ' · Issue · ' + (i.state || 'open'),
      icon: null,
      height: 60,
      html: ''
        + '<div style="display:flex;align-items:center;gap:8px;height:100%;">'
        + '  <span id="s" style="background:#222;border:1px solid #555;'
        +     'border-radius:14px;padding:6px 12px;font-size:12px;flex:1;'
        +     'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'
        + (i.labels && i.labels.length ? escapeHtml(i.labels.slice(0,2).join(' · ')) : 'Assigned to me')
        + '</span>'
        + '  <button id="c" style="border:1px solid #555;background:#222;color:#fff;'
        +     'border-radius:14px;padding:8px 14px;">Close</button>'
        + '</div>'
        + '<script>(function(){'
        + '  var p=' + idJson + ',c=document.getElementById("c"),s=document.getElementById("s");'
        + '  c.addEventListener("click",function(){'
        + '    c.disabled=true;c.textContent="…";'
        + '    iappyx.plugin("github").closeIssue(p)'
        + '      .then(function(){s.textContent="Closed ✓";c.style.display="none";})'
        + '      .catch(function(e){c.disabled=false;c.textContent="Close";s.textContent=(e&&e.message)||"failed";});'
        + '  });'
        + '})();<\/script>',
    };
  }

  function renderNotifHit(n) {
    var threadId = String(n.id || '');
    var subj = (n.subject && n.subject.title) || n.title || n.subject || '';
    var repoFullName = (n.repository && n.repository.full_name) || n.repoFullName || '';
    var idJson = JSON.stringify({ threadId: threadId });
    return {
      id: 'gh:notif:' + threadId,
      title: String(subj).slice(0, 80),
      subtitle: repoFullName + ' · ' + (n.reason || 'notification'),
      icon: null,
      height: 56,
      html: ''
        + '<div style="display:flex;align-items:center;gap:8px;height:100%;">'
        + '  <span id="s" style="flex:1;font-size:11px;color:#8E8E97;">Unread</span>'
        + '  <button id="r" style="border:1px solid #555;background:#222;color:#fff;'
        +     'border-radius:14px;padding:8px 14px;">Mark read</button>'
        + '</div>'
        + '<script>(function(){'
        + '  var p=' + idJson + ',r=document.getElementById("r"),s=document.getElementById("s");'
        + '  r.addEventListener("click",function(){'
        + '    r.disabled=true;r.textContent="…";'
        + '    iappyx.plugin("github").markNotificationRead(p)'
        + '      .then(function(){s.textContent="Read ✓";r.style.display="none";})'
        + '      .catch(function(e){r.disabled=false;r.textContent="Mark read";s.textContent=(e&&e.message)||"failed";});'
        + '  });'
        + '})();<\/script>',
    };
  }

  // ── Helpers used by renderers + inline actions ─────────────

  /** "https://api.github.com/repos/owner/repo" → "owner". Returns '' on
   *  malformed input — never throws. */
  function extractOwner(u) {
    var m = /\/repos\/([^/]+)\//.exec(String(u || ''));
    return m ? m[1] : '';
  }
  function extractRepo(u) {
    var m = /\/repos\/[^/]+\/([^/]+)/.exec(String(u || ''));
    return m ? m[1] : '';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  iappyx.plugin.log('github plugin loaded');
})();
</script>
</body>
</html>
