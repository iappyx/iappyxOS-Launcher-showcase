<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chromatic Halo Bloom</title>
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden;">
<canvas id="c" style="position:fixed;inset:0;width:100vw;height:100vh;display:block;"></canvas>
<script>
(function(){
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function fit(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
fit();
window.addEventListener('resize', fit);

// ── State ──────────────────────────────────────────────────────
let visible = true;
let pageOffset = 0;
let accelX = 0, accelY = 0;
let layout = { cells: [], dock: [], screen: { width: innerWidth, height: innerHeight }, pageCount: 1, pageWidth: innerWidth, currentPage: 0, systemBars: { top: 0, bottom: 0 } };
let time = 0;
let lastTs = null;

// ── Bridge setup ───────────────────────────────────────────────
if (window.iappyx) {
  iappyx.onVisibility = v => { visible = !!v; };
  iappyx.onPageOffset = x => { pageOffset = x; };
  iappyx.onAccelerometer = (x, y, z) => {
    accelX = accelX * 0.9 + x * 0.1;
    accelY = accelY * 0.9 + y * 0.1;
  };
  iappyx.enableAccelerometer(true);
  iappyx.onLayoutChanged = next => { layout = next; };
  try {
    const raw = iappyxLayout.get();
    if (raw) layout = JSON.parse(raw);
  } catch(e) {}
}

// ── Theme colors ───────────────────────────────────────────────
let themeColors = null;
try {
  if (window.iappyxDevice) {
    themeColors = JSON.parse(iappyxDevice.getThemeColors());
  }
} catch(e) {}

// ── Helper: parse hex color to [r,g,b] ────────────────────────
function hexToRgb(hex) {
  if (!hex) return null;
  const m = hex.replace('#','').match(/.{2}/g);
  if (!m || m.length < 3) return null;
  return [parseInt(m[0],16), parseInt(m[1],16), parseInt(m[2],16)];
}

// ── Halo object pool ───────────────────────────────────────────
// Each halo has intrinsic animation state layered on top of layout rect
const haloStates = new Map(); // key → { phase, speed, pulse }

function getHaloState(key, area) {
  if (!haloStates.has(key)) {
    haloStates.set(key, {
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 0.6,
      pulse: Math.random() * Math.PI * 2,
      area: area
    });
  }
  const s = haloStates.get(key);
  s.area = area;
  return s;
}

// ── Background particles (fill empty space atmospherically) ─────
const PARTICLE_COUNT = 60;
const particles = [];
for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    r: 1 + Math.random() * 2.5,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    phase: Math.random() * Math.PI * 2,
    hueShift: Math.random() * 60 - 30
  });
}

// ── Flowing energy lines ───────────────────────────────────────
const LINES = 8;
const energyLines = [];
for (let i = 0; i < LINES; i++) {
  const pts = [];
  const n = 6 + Math.floor(Math.random() * 4);
  for (let j = 0; j < n; j++) {
    pts.push({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      vx: (Math.random()-0.5)*0.4,
      vy: (Math.random()-0.5)*0.4
    });
  }
  energyLines.push({ pts, phase: Math.random()*Math.PI*2, speed: 0.3+Math.random()*0.5 });
}

// ── Canvas off-screen for multi-pass blur simulation ──────────
const offA = document.createElement('canvas');
const offB = document.createElement('canvas');
const ctxA = offA.getContext('2d');
const ctxB = offB.getContext('2d');
function resizeOff() {
  offA.width = offB.width = canvas.width;
  offA.height = offB.height = canvas.height;
}
resizeOff();
window.addEventListener('resize', resizeOff);

// ── SVG filter for heavy glow blur (injected once) ─────────────
const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
svg.setAttribute('width','0');
svg.setAttribute('height','0');
svg.style.position = 'absolute';
svg.innerHTML = `
<defs>
  <filter id="haloglow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
    <feMerge><feMergeNode in="blur1"/><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>`;
document.body.appendChild(svg);

// ── Core hue cycling ──────────────────────────────────────────
// 12-second full hue loop
const HUE_PERIOD = 12.0;

function globalHue(t) {
  // page offset shifts hue offset so swiping feels chromatic
  const pageShift = pageOffset * 120;
  return ((t / HUE_PERIOD) * 360 + pageShift) % 360;
}

// ── Draw a feathered halo around a rect ───────────────────────
function drawHalo(cx, cy, w, h, hue, alpha, glowRadius, pulseScale) {
  const rw = (w * 0.5 + glowRadius) * pulseScale;
  const rh = (h * 0.5 + glowRadius) * pulseScale;
  const r = Math.min(rw, rh) * 0.3 + 6;

  // Multiple layered gradients to simulate blur spread
  const layers = [
    { spread: 1.0, a: alpha * 0.08, sat: 60, lit: 80 },
    { spread: 0.75, a: alpha * 0.15, sat: 80, lit: 70 },
    { spread: 0.55, a: alpha * 0.25, sat: 90, lit: 60 },
    { spread: 0.35, a: alpha * 0.35, sat: 100, lit: 55 },
    { spread: 0.15, a: alpha * 0.20, sat: 100, lit: 65 },
  ];

  for (const layer of layers) {
    const lw = rw * (1 + layer.spread);
    const lh = rh * (1 + layer.spread);
    // Radial gradient from center
    // Use ellipse approximation via scale transform
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(lw / (Math.max(lw, lh) || 1), lh / (Math.max(lw, lh) || 1));
    const maxR = Math.max(lw, lh);
    const grad = ctx.createRadialGradient(0, 0, Math.min(rw,rh)*0.5/(Math.max(lw,lh)/maxR), 0, 0, maxR);
    grad.addColorStop(0, `hsla(${hue},${layer.sat}%,${layer.lit}%,${layer.a})`);
    grad.addColorStop(0.5, `hsla(${hue},${layer.sat}%,${layer.lit}%,${layer.a * 0.4})`);
    grad.addColorStop(1, `hsla(${hue},${layer.sat}%,${layer.lit}%,0)`);
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, maxR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Sharp inner ring outline — chromatic fringe effect
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.shadowBlur = 16;
  ctx.shadowColor = `hsla(${hue},100%,70%,0.6)`;
  ctx.strokeStyle = `hsla(${hue},100%,75%,${alpha * 0.5})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  // Rounded rect
  const rx = cx - w*0.5*pulseScale, ry = cy - h*0.5*pulseScale;
  const rwidth = w*pulseScale, rheight = h*pulseScale;
  const corner = Math.min(r, rwidth*0.5, rheight*0.5);
  ctx.moveTo(rx + corner, ry);
  ctx.lineTo(rx + rwidth - corner, ry);
  ctx.arcTo(rx + rwidth, ry, rx + rwidth, ry + corner, corner);
  ctx.lineTo(rx + rwidth, ry + rheight - corner);
  ctx.arcTo(rx + rwidth, ry + rheight, rx + rwidth - corner, ry + rheight, corner);
  ctx.lineTo(rx + corner, ry + rheight);
  ctx.arcTo(rx, ry + rheight, rx, ry + rheight - corner, corner);
  ctx.lineTo(rx, ry + corner);
  ctx.arcTo(rx, ry, rx + corner, ry, corner);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();

  // Chromatic aberration: offset secondary halo rings
  const hue2 = (hue + 30) % 360;
  const hue3 = (hue - 30 + 360) % 360;
  for (const [dh, dx, dy] of [[hue2, 3, 1],[hue3, -3, -1]]) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.strokeStyle = `hsla(${dh},100%,70%,${alpha * 0.18})`;
    ctx.lineWidth = 1;
    ctx.shadowBlur = 8;
    ctx.shadowColor = `hsla(${dh},100%,70%,0.3)`;
    ctx.beginPath();
    const rx2 = cx - w*0.5*pulseScale + dx, ry2 = cy - h*0.5*pulseScale + dy;
    const c2 = Math.min(corner, rwidth*0.5, rheight*0.5);
    ctx.moveTo(rx2 + c2, ry2);
    ctx.lineTo(rx2 + rwidth - c2, ry2);
    ctx.arcTo(rx2 + rwidth, ry2, rx2 + rwidth, ry2 + c2, c2);
    ctx.lineTo(rx2 + rwidth, ry2 + rheight - c2);
    ctx.arcTo(rx2 + rwidth, ry2 + rheight, rx2 + rwidth - c2, ry2 + rheight, c2);
    ctx.lineTo(rx2 + c2, ry2 + rheight);
    ctx.arcTo(rx2, ry2 + rheight, rx2, ry2 + rheight - c2, c2);
    ctx.lineTo(rx2, ry2 + c2);
    ctx.arcTo(rx2, ry2, rx2 + c2, ry2, c2);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }
}

// ── Draw energy flow line ─────────────────────────────────────
function drawEnergyLine(line, hue, t) {
  if (line.pts.length < 2) return;
  // Update positions
  for (const p of line.pts) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
  }
  const alpha = 0.12 + 0.06 * Math.sin(t * line.speed + line.phase);
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.strokeStyle = `hsla(${hue},90%,70%,${alpha})`;
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 12;
  ctx.shadowColor = `hsla(${hue},100%,65%,0.4)`;
  ctx.beginPath();
  ctx.moveTo(line.pts[0].x, line.pts[0].y);
  for (let i = 1; i < line.pts.length - 1; i++) {
    const mx = (line.pts[i].x + line.pts[i+1].x)*0.5;
    const my = (line.pts[i].y + line.pts[i+1].y)*0.5;
    ctx.quadraticCurveTo(line.pts[i].x, line.pts[i].y, mx, my);
  }
  ctx.lineTo(line.pts[line.pts.length-1].x, line.pts[line.pts.length-1].y);
  ctx.stroke();
  ctx.restore();
}

// ── Build rect list from current layout + page offset ─────────
function getVisibleRects() {
  const rects = [];
  const pageCount = Math.max(1, layout.pageCount - 1 || 1);
  const fracHome = pageOffset * pageCount;

  for (let i = 0; i < layout.cells.length; i++) {
    const c = layout.cells[i];
    const liveX = c.x + (c.page - fracHome) * (layout.pageWidth || innerWidth);
    // Only include cells roughly on screen
    if (liveX + c.w < -c.w * 2 || liveX > canvas.width + c.w * 2) continue;
    rects.push({ key: 'cell_' + i, cx: liveX + c.w*0.5, cy: c.y + c.h*0.5, w: c.w, h: c.h, isDock: false });
  }
  for (let i = 0; i < layout.dock.length; i++) {
    const d = layout.dock[i];
    rects.push({ key: 'dock_' + i, cx: d.x + d.w*0.5, cy: d.y + d.h*0.5, w: d.w, h: d.h, isDock: true });
  }
  return rects;
}

// ── Ambient background nebula ──────────────────────────────────
function drawNebula(hue, t) {
  const w = canvas.width, h = canvas.height;
  // Slow drifting radial blob
  const blobX = w * 0.5 + Math.sin(t * 0.07 + accelX * 0.05) * w * 0.25;
  const blobY = h * 0.5 + Math.cos(t * 0.05 + accelY * 0.05) * h * 0.2;

  const grad = ctx.createRadialGradient(blobX, blobY, 0, blobX, blobY, Math.min(w,h)*0.7);
  grad.addColorStop(0, `hsla(${hue},40%,8%,0.7)`);
  grad.addColorStop(0.4, `hsla(${(hue+60)%360},30%,5%,0.4)`);
  grad.addColorStop(1, `hsla(${(hue+120)%360},20%,2%,0)`);
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,w,h);
  ctx.restore();

  // Second blob complement
  const bx2 = w * 0.2 + Math.cos(t * 0.06) * w * 0.15;
  const by2 = h * 0.8 + Math.sin(t * 0.08) * h * 0.1;
  const grad2 = ctx.createRadialGradient(bx2, by2, 0, bx2, by2, Math.min(w,h)*0.5);
  grad2.addColorStop(0, `hsla(${(hue+180)%360},35%,6%,0.5)`);
  grad2.addColorStop(1, `rgba(0,0,0,0)`);
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = grad2;
  ctx.fillRect(0,0,w,h);
  ctx.restore();
}

// ── Draw background particles ─────────────────────────────────
function drawParticles(hue, t) {
  for (const p of particles) {
    p.x += p.vx + accelX * 0.005;
    p.y += p.vy + accelY * 0.005;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;
    const ph = (hue + p.hueShift + 360) % 360;
    const brightness = 0.4 + 0.4 * Math.sin(t * 0.8 + p.phase);
    const alpha = brightness * 0.5;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
    grad.addColorStop(0, `hsla(${ph},100%,80%,${alpha})`);
    grad.addColorStop(1, `hsla(${ph},100%,60%,0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ── Synthwave scanline overlay (subtle) ───────────────────────
function drawScanlines() {
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'rgba(0,0,0,0.04)';
  for (let y = 0; y < canvas.height; y += 4) {
    ctx.fillRect(0, y, canvas.width, 1);
  }
  ctx.restore();
}

// ── Full-screen chromatic pass on offscreen canvas ─────────────
function drawChromaticOverlay(hue, t) {
  // Render a very faint full-bleed color-shifted layer using canvas filter
  // to simulate the "screen capture tint" effect
  ctxA.clearRect(0, 0, offA.width, offA.height);

  // Paint halos on offA
  const rects = getVisibleRects();
  for (const rect of rects) {
    const s = getHaloState(rect.key, rect.w * rect.h);
    const area = rect.w * rect.h;
    const normSize = Math.min(1, Math.sqrt(area) / 120);
    const sat = 70 + normSize * 30;
    const lit = 55 + normSize * 15;
    ctxA.save();
    ctxA.globalCompositeOperation = 'screen';
    ctxA.shadowBlur = 40 + normSize * 30;
    ctxA.shadowColor = `hsla(${hue},${sat}%,${lit}%,0.9)`;
    ctxA.fillStyle = `hsla(${hue},${sat}%,${lit}%,0.25)`;
    ctxA.beginPath();
    const corner = Math.min(rect.w, rect.h) * 0.25;
    const rx = rect.cx - rect.w*0.5, ry = rect.cy - rect.h*0.5;
    ctxA.roundRect(rx, ry, rect.w, rect.h, corner);
    ctxA.fill();
    ctxA.restore();
  }

  // Blur offA onto offB (simulate Gaussian multi-pass)
  ctxB.clearRect(0, 0, offB.width, offB.height);
  ctxB.filter = 'blur(20px)';
  ctxB.drawImage(offA, 0, 0);
  ctxB.filter = 'none';

  // Composite blurred layer onto main canvas with screen blend
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.6;
  ctx.drawImage(offB, 0, 0);
  ctx.globalAlpha = 1;
  ctx.restore();

  // Also composite the sharp version at low alpha for crispness
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.3;
  ctx.drawImage(offA, 0, 0);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ── Main draw ─────────────────────────────────────────────────
function draw(ts) {
  if (lastTs === null) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  time += dt;
  const t = time;

  // Clear with deep dark
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(2,1,6,1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const hue = globalHue(t);

  // 1. Ambient nebula background
  drawNebula(hue, t);

  // 2. Energy flow lines
  for (const line of energyLines) {
    drawEnergyLine(line, (hue + 30) % 360, t);
  }

  // 3. Per-element halos
  const rects = getVisibleRects();
  for (const rect of rects) {
    const s = getHaloState(rect.key, rect.w * rect.h);
    const area = rect.w * rect.h;
    const normSize = Math.min(1, Math.sqrt(area) / 100);

    // Per-element subtle hue variation based on position
    const posHueShift = (rect.cx / canvas.width) * 40 - 20;
    const elemHue = (hue + posHueShift + 360) % 360;

    // Pulse
    const pulse = 1.0 + 0.04 * Math.sin(t * s.speed * 1.5 + s.pulse);
    const glowRadius = 20 + normSize * 35 + 10 * Math.sin(t * s.speed + s.phase);
    const alpha = rect.isDock
      ? 0.75 + 0.15 * Math.sin(t * 0.9 + s.phase)
      : 0.55 + 0.2 * Math.sin(t * s.speed * 0.8 + s.phase);

    drawHalo(rect.cx, rect.cy, rect.w, rect.h, elemHue, alpha, glowRadius, pulse);
  }

  // 4. Chromatic blur overlay pass (offscreen)
  drawChromaticOverlay(hue, t);

  // 5. Background particles
  drawParticles(hue, t);

  // 6. Full-screen additive chromatic fringe vignette
  const vw = canvas.width, vh = canvas.height;
  const vign = ctx.createRadialGradient(vw*0.5, vh*0.5, vh*0.1, vw*0.5, vh*0.5, vh*0.85);
  vign.addColorStop(0, 'rgba(0,0,0,0)');
  vign.addColorStop(0.6, 'rgba(0,0,0,0)');
  vign.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = vign;
  ctx.fillRect(0,0,vw,vh);
  ctx.restore();

  // 7. Subtle scanlines
  drawScanlines();

  // 8. Corner chromatic accent glows (static screen decoration)
  const corners = [
    [0,0], [vw,0], [0,vh], [vw,vh]
  ];
  for (let i = 0; i < corners.length; i++) {
    const [cx2, cy2] = corners[i];
    const ch = (hue + i * 90) % 360;
    const cg = ctx.createRadialGradient(cx2, cy2, 0, cx2, cy2, Math.min(vw,vh)*0.35);
    cg.addColorStop(0, `hsla(${ch},80%,60%,${0.06 + 0.03*Math.sin(t*0.4+i)})`);
    cg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = cg;
    ctx.fillRect(0,0,vw,vh);
    ctx.restore();
  }
}

// ── Animation loop ─────────────────────────────────────────────
function tick(ts) {
  if (visible) {
    draw(ts);
  }
  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);

})();
</script>
</body>
</html>
